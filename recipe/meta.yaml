{% set name = "perl-io-null" %}
{% set version = "1.01" %}
{% set sha256 = "3a9adeffff8d64b157c3ddb9c54468e7296356a07081739e9ab903b4953248b3" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/S/SB/SBURKE/IO-Null-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 1
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
  run:
    - perl

test:
  imports:
    - IO::Null

about:
  home: https://metacpan.org/pod/IO::Null
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file:
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlartistic.pod
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlgpl.pod
  summary: 'class for null filehandles'

extra:
  recipe-maintainers:
    - xileF1337
    - cbrueffer
